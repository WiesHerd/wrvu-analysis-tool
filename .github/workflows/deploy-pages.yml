# Build the React app and push the build to the gh-pages branch.
# In repo Settings → Pages, set Source to "Deploy from a branch", Branch to "gh-pages", folder / (root).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# contents: write is required for peaceiris/actions-gh-pages to push to gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_URL: '/wrvu-analysis-tool'
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
